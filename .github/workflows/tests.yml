---
name: Tests
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'  # This will trigger for PRs against any branch

defaults:
  run:
    shell: bash

jobs:
  cmake_tests:
    name: ${{ matrix.build_type.test_type }} tests, ${{ matrix.build_type.name }}
    runs-on: ${{ matrix.config.os }}
    env:
      OMP_NUM_THREADS: ${{ matrix.config.omp_num_threads }}
      PYTHONPATH: ${{ github.workspace }}/tools/pylib
      OMPI_MCA_rmaps_base_oversubscribe: yes
      MPIRUN: mpiexec -np
      LD_LIBRARY_PATH: /home/runner/local/lib:$LD_LIBRARY_PATH
      BOUT_CONFIGURE_OPTIONS: ${{ matrix.build_type.bout_configure_options }}
      HERMES_CONFIGURE_OPTIONS: ${{ matrix.build_type.hermes_configure_options }} -DHERMES_COVERAGE=${{ matrix.build_type.coverage }} -DBOUT++_ROOT=/home/runner/local_bout
      BUILD_TYPE: ${{ matrix.build_type.cmake_build_type }}
      TEST_TYPE: ${{ matrix.build_type.test_type }}
      PETSC_DIR: /usr/lib/petscdir/petsc3.12/x86_64-linux-gnu-real
      PETSC_ARCH: ""
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-latest
        build_type:
          - cmake_build_type: Debug
            test_type: unit
            coverage: ON
            name: "CMake default options"
            bout_configure_options: "-DPACKAGE_TESTS=OFF"
            hermes_configure_options: "-DHERMES_ERROR_ON_WARNINGS=ON"
          - cmake_build_type: Release
            test_type: integration
            coverage: OFF
            name: "CMake default options"
            bout_configure_options: "-DPACKAGE_TESTS=OFF
                                -DBOUT_USE_PETSC=ON
                                -DBOUT_USE_SLEPC=ON
                                -DBOUT_USE_SUNDIALS=ON
                                -DSUNDIALS_ROOT=/home/runner/local
                                -DBOUT_USE_HYPRE=ON"
            hermes_configure_options: "-DHERMES_ERROR_ON_WARNINGS=ON"
          - cmake_build_type: Debug
            test_type: unit
            coverage: ON
            name: "3D metrics"
            bout_configure_options: "-DPACKAGE_TESTS=OFF -DBOUT_ENABLE_METRIC_3D=ON"
            hermes_configure_options: "-DHERMES_ERROR_ON_WARNINGS=ON"
          - cmake_build_type: Debug
            test_type: integration
            name: "3D metrics"
            bout_configure_options: "-DPACKAGE_TESTS=OFF -DBOUT_ENABLE_METRIC_3D=ON"
            hermes_configure_options: "-DHERMES_ERROR_ON_WARNINGS=ON"
            coverage: OFF

    steps:
      - name: Job information
        run: |
          echo Build: ${{ matrix.config.name }}, ${{ matrix.config.os }}
          echo Configure options: ${{ matrix.build_type.configure_options }}
          echo Build type: ${{ matrix.build_type.cmake_build_type }}
          echo Coverage: ${{ matrix.build_type.coverage }}
          echo Tests to run: ${{ matrix.build_type.test_type }}

      - name: Install dependencies
        run: sudo apt update &&
             sudo apt install -y
                 lcov
                 libfftw3-dev
                 libnetcdf-dev
                 libnetcdf-c++4-dev
                 netcdf-bin
                 python3
                 python3-pip
                 python3-pytest
                 python3-numpy
                 python3-scipy
                 openmpi-bin
                 libopenmpi-dev
                 petsc-dev
                 slepc-dev
                 liblapack-dev
                 libparpack2-dev
                 libhypre-dev

      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Cache SUNDIALS build
        uses: actions/cache@v6
        with:
          path: /home/runner/local
          key: bout-sundials-${{ matrix.config.os }}-${{ hashFiles('./external/BOUT-dev/.build_sundials_for_ci.sh') }}

      - name: Build SUNDIALS
        run: ./external/BOUT-dev/.build_sundials_for_ci.sh

      - name: Construct BOUT++ cache key
        id: bout-cache-key
        run: |
          echo "$(git submodule status external/BOUT-dev)" > bout_build_info.txt
          echo "Build type: $BUILD_TYPE" >> bout_build_info.txt
          echo "$BOUT_CONFIGURE_OPTIONS" >> bout_build_info.txt
          echo "${{ hashFiles('./external/BOUT-dev/.build_sundials_for_ci.sh') }}" >> bout_build_info.txt
          echo "bout_key=${{ hashFiles('bout_build_info.txt') }}" >> "$GITHUB_OUTPUT"

      - name: Cache BOUT++ build
        uses: actions/cache@v6
        with:
          path: /home/runner/local_bout
          key: bout-${{ matrix.config.os }}-${{ steps.bout-cache-key.outputs.bout_key }}

      - name: Build BOUT++
        run: ./.build_bout_for_ci.sh

      - name: Install pip packages
        run: |
          ./ci/pip_install.sh
          # Add the pip install location to the runner's PATH
          echo ~/.local/bin >> $GITHUB_PATH

      - name: Build
        run: cmake . -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE $HERMES_CONFIGURE_OPTIONS &&
             cmake --build build -j4

      - name: Run tests
        id: run-tests
        run: >
          cd build &&
          ctest --output-on-failure --timeout 300 -L $TEST_TYPE &&
          echo "num_tests=$(ctest -N -L $TEST_TYPE | grep -P -o '(?<=Total Tests: )[0-9]+')" >> "$GITHUB_OUTPUT"
      - name: Upload test coverage data
        uses: codecov/codecov-action@v5
        if: ${{ matrix.build_type.coverage == 'ON' && steps.run-tests.outputs.num_tests > 0 }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
